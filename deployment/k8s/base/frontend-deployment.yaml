apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: yt-viewer-tracker
spec:
  replicas: 2 # frontend is stateless nginx serving static files + proxying to backend - safe to scale freely
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend-image # kustomize rewrites this to the real ECR image:tag - see kustomization.yaml
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
