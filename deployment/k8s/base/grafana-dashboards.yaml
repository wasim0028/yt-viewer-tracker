# Dashboards as code. Grafana loads this file at startup (see the
# provisioning ConfigMap in grafana.yaml), so a fresh pod always has the
# same dashboards and nothing is lost when the pod is replaced.
# Metrics shown are the ones prom-client exposes by default; add custom
# counters in backend/server.js and graph them here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: yt-viewer-tracker
data:
  backend.json: |
    {
      "uid": "yt-backend",
      "title": "Viewer Watch - Backend",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-3h",
        "to": "now"
      },
      "tags": [
        "viewer-watch"
      ],
      "editable": true,
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Backend up",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{job=\"backend\"}"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Memory (RSS)",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "process_resident_memory_bytes{job=\"backend\"}"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Process uptime",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - process_start_time_seconds{job=\"backend\"}"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Open file descriptors",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "expr": "process_open_fds{job=\"backend\"}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU (cores)",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "rate(process_cpu_seconds_total{job=\"backend\"}[5m])",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memory (RSS)",
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "process_resident_memory_bytes{job=\"backend\"}",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Node.js heap used",
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "nodejs_heap_size_used_bytes{job=\"backend\"}",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Event loop lag p99",
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "amp"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "nodejs_eventloop_lag_p99_seconds{job=\"backend\"}",
              "legendFormat": "{{job}}"
            }
          ]
        }
      ]
    }
