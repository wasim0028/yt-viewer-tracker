# ServiceAccount that External Secrets Operator's ClusterSecretStore uses to
# authenticate to AWS. The role-arn annotation is what makes IRSA work -
# paste in the ARN from `terraform output external_secrets_role_arn`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::326334468168:role/yt-viewer-tracker-external-secrets"
