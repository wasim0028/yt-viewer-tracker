apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: yt-viewer-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: backend-secrets # the real k8s Secret this creates
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: yt-viewer-tracker/database-url
  dataFrom:
    - extract:
        key: yt-viewer-tracker/api-keys
