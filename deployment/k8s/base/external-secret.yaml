# This is what actually replaces a plain, git-committed Secret manifest.
# ESO reads the real values from AWS Secrets Manager (never from git) and
# materializes them as one normal Kubernetes Secret in-cluster.
#
# Pulls from TWO separate Secrets Manager secrets and merges them into one
# k8s Secret - deliberately not one combined secret, because the two halves
# have opposite lifecycles: database-url is fully Terraform-owned and safe
# to keep auto-updating (e.g. if the password is ever rotated), while
# api-keys is manually set once via the AWS CLI and must never be reset
# back to its placeholder by a future `terraform apply`. Mixing both into
# a single secret_string would make protecting one half without also
# freezing the other impossible.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: yt-viewer-tracker
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: backend-secrets # the real k8s Secret this creates
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: yt-viewer-tracker/database-url
    - extract:
        key: yt-viewer-tracker/api-keys
