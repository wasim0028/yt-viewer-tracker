<svg viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowBlue" cx="15%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#2f6fed" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#2f6fed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRed" cx="92%" cy="12%" r="55%">
      <stop offset="0%" stop-color="#e5384b" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e5384b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="50%" stop-color="#e5384b"/>
      <stop offset="50%" stop-color="#2f6fed"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="#0b0d12"/>
  <rect width="1280" height="320" fill="url(#glowBlue)"/>
  <rect width="1280" height="320" fill="url(#glowRed)"/>

  <!-- Brand mark -->
  <rect x="70" y="96" width="72" height="72" rx="18" fill="url(#markGrad)"/>

  <!-- Wordmark -->
  <text x="70" y="220" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="0.5" fill="#edeff4">Viewer Watch</text>
  <text x="72" y="256" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#8a90a3">Live YouTube viewer tracking, channel vs. channel, in real time.</text>

  <!-- Live badge -->
  <circle cx="76" cy="80" r="5" fill="#ff3b52"/>
  <text x="90" y="85" font-family="Courier New, monospace" font-size="13" letter-spacing="1.5" fill="#ff6b7f">LIVE</text>

  <!-- Mini chart panel -->
  <rect x="700" y="52" width="500" height="216" rx="16" fill="#14171f" stroke="#262b38" stroke-width="1"/>

  <!-- grid -->
  <g stroke="#1f2430" stroke-width="1">
    <line x1="730" y1="90" x2="1170" y2="90"/>
    <line x1="730" y1="130" x2="1170" y2="130"/>
    <line x1="730" y1="170" x2="1170" y2="170"/>
    <line x1="730" y1="210" x2="1170" y2="210"/>
    <line x1="820" y1="76" x2="820" y2="230"/>
    <line x1="950" y1="76" x2="950" y2="230"/>
    <line x1="1080" y1="76" x2="1080" y2="230"/>
  </g>
  <rect x="730" y="76" width="440" height="154" fill="none" stroke="#3a4256" stroke-width="1"/>

  <!-- red line (RBANGLA-style) -->
  <polyline points="730,205 775,208 820,200 865,202 910,196 955,199 1000,190 1045,178 1090,168 1135,160 1170,150"
            fill="none" stroke="#e5384b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- blue line (ABPANANDA-style) -->
  <polyline points="730,178 775,182 820,150 865,120 910,124 955,108 1000,112 1045,92 1090,98 1135,84 1170,80"
            fill="none" stroke="#2f6fed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g fill="#e5384b">
    <circle cx="730" cy="205" r="3"/><circle cx="820" cy="200" r="3"/><circle cx="910" cy="196" r="3"/>
    <circle cx="1000" cy="190" r="3"/><circle cx="1090" cy="168" r="3"/><circle cx="1170" cy="150" r="3"/>
  </g>
  <g fill="#2f6fed">
    <circle cx="730" cy="178" r="3"/><circle cx="820" cy="150" r="3"/><circle cx="910" cy="124" r="3"/>
    <circle cx="1000" cy="112" r="3"/><circle cx="1090" cy="98" r="3"/><circle cx="1170" cy="80" r="3"/>
  </g>

  <!-- legend -->
  <circle cx="730" cy="248" r="5" fill="#e5384b"/>
  <text x="742" y="253" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8a90a3">RBANGLA</text>
  <circle cx="825" cy="248" r="5" fill="#2f6fed"/>
  <text x="837" y="253" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8a90a3">ABPANANDA</text>
</svg>
